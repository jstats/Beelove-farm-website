<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rwanda Rain Outlook</title>
<meta name="description" content="Beelove Farm rain outlook for Rwanda, October–December: chance of more or less rain than usual, district by district, with how far to trust it." />
<style>
  :root {
    --cream: #f7efe4; --card: #fffaf3; --umber: #3d2817; --umber-2: #6b5a4a; --muted: #9a8b7b;
    --honey: #e8b84a; --honey-ink: #8a5a00; --line: #e6dccd; --land: #ebe7e0;
    --dry: #8c510a; --usual: #f5f0e6; --wet: #7fcdbb; --wet-hi: #08589e; --none: #e6e1d8; --none-edge: #b8ae9f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--cream); color: var(--umber); }
  body { font: 15px/1.5 "Fira Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  h1, h2, h3 { font-family: "DM Serif Display", Georgia, "Times New Roman", serif; font-weight: 400; margin: 0; }
  h1 { font-size: 26px; line-height: 1.15; }
  .sub { color: var(--umber-2); margin: 4px 0 0; font-size: 14px; }
  .wrap { max-width: 1120px; margin: 0 auto; }
  .modes { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 10px; }
  .modes button { font: inherit; font-size: 13.5px; border: 1px solid var(--line); background: var(--card); color: var(--umber);
    padding: 7px 12px; border-radius: 999px; cursor: pointer; }
  .modes button[aria-pressed="true"] { background: var(--umber); color: var(--cream); border-color: var(--umber); }
  .grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } body { padding: 12px; } h1 { font-size: 22px; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
  .mapcard { padding: 8px; position: relative; }
  svg.map { width: 100%; height: auto; display: block; touch-action: manipulation; }
  .cell { cursor: pointer; }
  .cell:hover { filter: brightness(0.96); }
  svg.map path { vector-effect: non-scaling-stroke; }
  .dist { fill: none; stroke: #fff; stroke-width: 0.9; pointer-events: none; }
  .dist.sel { stroke: var(--honey); stroke-width: 3; }
  .ctry { fill: none; stroke: var(--umber); stroke-width: 1.3; pointer-events: none; }
  .cellsel { fill: none; stroke: var(--umber); stroke-width: 2.2; pointer-events: none; }
  .lbl { font-size: var(--lbl, 14px); fill: var(--umber); paint-order: stroke; stroke: #fff; stroke-width: calc(var(--lbl, 14px) * 0.3); stroke-linejoin: round; pointer-events: none; }
  .lbl.k { font-weight: 700; font-size: calc(var(--lbl, 14px) * 1.1); }
  .nlbl { font-size: var(--lbl, 14px); fill: var(--muted); font-style: italic; letter-spacing: .08em; pointer-events: none; }
  .panel a { color: var(--honey-ink); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 8px 4px; font-size: 12.5px; color: var(--umber-2); }
  .sw { display: inline-block; width: 13px; height: 13px; border-radius: 3px; margin-right: 6px; vertical-align: -2px; border: 1px solid rgba(61,40,23,.15); }
  .sw.hatch { background: repeating-linear-gradient(135deg, var(--none) 0 3px, var(--none-edge) 3px 4px); }
  .panel { padding: 18px; min-height: 200px; }
  .panel .where { font-size: 13px; color: var(--umber-2); }
  .panel h2 { font-size: 24px; margin: 2px 0 10px; }
  .big { display: flex; align-items: baseline; gap: 10px; }
  .big b { font-size: 38px; font-weight: 700; line-height: 1; }
  .big span { color: var(--umber-2); }
  .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin: 12px 0 4px; }
  .barlbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--umber-2); }
  .row { margin-top: 12px; }
  .dots { display: inline-flex; gap: 4px; vertical-align: middle; margin-left: 6px; }
  .dots i { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid #2e7d4f; display: inline-block; }
  .dots i.on { background: #2e7d4f; }
  .muted { color: var(--umber-2); font-size: 13.5px; }
  .chart { margin-top: 14px; }
  .chart h3 { font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--umber-2); text-transform: uppercase; letter-spacing: .06em; }
  .hint { color: var(--umber-2); }
  .districts { margin-top: 16px; padding: 16px; }
  .districts h2 { font-size: 21px; }
  .search { width: 100%; font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--umber); margin: 10px 0 8px; }
  .dlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px; }
  .dlist button { font: inherit; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    border: 1px solid var(--line); background: #fff; color: var(--umber); padding: 8px 10px; border-radius: 12px; cursor: pointer; }
  .dlist button:hover, .dlist button[aria-current="true"] { border-color: var(--honey); background: #fff8e6; }
  .dlist small { color: var(--muted); display: block; font-size: 11.5px; }
  .dlist .v { font-weight: 700; font-size: 14px; white-space: nowrap; }
  .dlist .v.no { font-weight: 400; color: var(--muted); font-size: 12.5px; }
  details { margin-top: 16px; padding: 14px 16px; }
  details summary { cursor: pointer; font-weight: 600; }
  details p, details li { color: var(--umber-2); font-size: 14px; }
  details ul { padding-left: 18px; }
  .foot { font-size: 12px; color: var(--muted); margin: 14px 2px 4px; }
  button:focus-visible, .search:focus-visible { outline: 2px solid var(--honey); outline-offset: 2px; }
  /* inside the website page the panel above already carries the title */
  body.embedded { padding: 12px; background: var(--card); }
  body.embedded #title, body.embedded #subtitle { display: none; }
  body.embedded .modes { margin-top: 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>

  <div class="modes" role="group" aria-label="What the map shows">
    <button type="button" data-mode="outlook" aria-pressed="true">Rain outlook</button>
    <button type="button" data-mode="skill" aria-pressed="false">How far to trust it</button>
    <button type="button" data-mode="normal" aria-pressed="false">Usual Oct–Dec rain</button>
  </div>

  <div class="grid">
    <div class="card mapcard">
      <svg class="map" id="map" role="img" aria-label="Map of Rwanda"></svg>
      <div class="legend" id="legend"></div>
    </div>
    <div class="card panel" id="panel" aria-live="polite"></div>
  </div>

  <div class="card districts">
    <h2>Find your district</h2>
    <input class="search" id="search" type="search" placeholder="Type a district, e.g. Nyagatare" aria-label="Search districts" />
    <p class="muted" style="margin:0 0 8px">Chance of more rain than usual in October–December, and how far to trust it.</p>
    <div class="dlist" id="dlist"></div>
  </div>

  <details class="card">
    <summary>What this is, and how far to trust it</summary>
    <div id="how"></div>
  </details>

  <p class="foot" id="foot"></p>
</div>

const MONTHS = ['J','F','M','A','M','J','J','A','S','O','N','D'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const K = 420, PAD = 0.05;
const [minx, miny, maxx, maxy] = D.bbox;
const X0 = minx - PAD, Y0 = maxy + PAD;
const X = (lon) => (lon - X0) * K, Y = (lat) => (Y0 - lat) * K;
const W = X(maxx + PAD), H = Y(miny - PAD);
const NS = 'http://www.w3.org/2000/svg';
const SKILL = { 0: null, 1: '#cde2fb', 2: '#6da7ec', 3: '#184f95' };
const SKILL_WORD = { 0: 'No skill here', 1: 'Weak', 2: 'Fair', 3: 'Good' };
const SKILL_LONG = {
  0: 'In past seasons the model has not worked here, so there is no outlook.',
  1: 'Weak: a slight edge over the long-term average in past years.',
  2: 'Fair: has beaten the long-term average in most past years.',
  3: 'Good: the best this method does anywhere in Rwanda.'
};
let mode = 'outlook', selCell = null, selDist = null;

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function ring(r) { return 'M' + r.map((p) => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join('L') + 'Z'; }
function polysOf(g) { return g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : []; }
function pathOf(g) { return polysOf(g).map((p) => p.map(ring).join('')).join(''); }
function inRing(x, y, r) {
  let c = false;
  for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
    const [xi, yi] = r[i], [xj, yj] = r[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c;
  }
  return c;
}
function inGeom(x, y, g) { return polysOf(g).some((p) => inRing(x, y, p[0]) && !p.slice(1).some((h) => inRing(x, y, h))); }

// ---- colours -------------------------------------------------------------
function hex(h) { return [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); }
function mix(stops, t) {
  t = Math.max(0, Math.min(1, t));
  for (let i = 1; i < stops.length; i++) {
    if (t <= stops[i][0]) {
      const [t0, c0] = stops[i - 1], [t1, c1] = stops[i];
      const u = (t - t0) / (t1 - t0 || 1), a = hex(c0), b = hex(c1);
      return 'rgb(' + a.map((v, k) => Math.round(v + (b[k] - v) * u)).join(',') + ')';
    }
  }
  return stops[stops.length - 1][1];
}
const NORMAL_STOPS = [[0, '#f3f7e6'], [0.5, '#a8d5a2'], [1, '#2f6b4a']];
const nvals = D.cells.map((c) => c.normal);
const NMIN = Math.floor(Math.min(...nvals) / 10) * 10, NMAX = Math.ceil(Math.max(...nvals) / 10) * 10;
function fillFor(c) {
  if (mode === 'outlook') return c.outlook ? c.colour : 'url(#hatch)';
  if (mode === 'skill') return c.dots ? SKILL[c.dots] : 'url(#hatch)';
  return mix(NORMAL_STOPS, (c.normal - NMIN) / (NMAX - NMIN));
}

// ---- map -------------------------------------------------------------------
const svg = document.getElementById('map');
svg.setAttribute('viewBox', `0 0 ${W.toFixed(0)} ${H.toFixed(0)}`);
const defs = el('defs', {}, svg);
const pat = el('pattern', { id: 'hatch', patternUnits: 'userSpaceOnUse', width: 7, height: 7, patternTransform: 'rotate(45)' }, defs);
el('rect', { width: 7, height: 7, fill: '#e6e1d8' }, pat);
el('line', { x1: 0, y1: 0, x2: 0, y2: 7, stroke: '#b8ae9f', 'stroke-width': 1.4 }, pat);
el('rect', { x: 0, y: 0, width: W, height: H, fill: '#efebe4' }, svg);
const gN = el('g', {}, svg);
D.neighbours.forEach((n) => el('path', { d: pathOf(n), fill: '#e6e1d9', stroke: '#d3ccc0', 'stroke-width': 1 }, gN));
D.neighbours.forEach((n) => {
  if (n.label && n.label[0] != null) {
    const t = el('text', { x: X(n.label[0]), y: Y(n.label[1]), class: 'nlbl', 'text-anchor': 'middle',
      transform: n.label[2] ? `rotate(${-n.label[2]} ${X(n.label[0])} ${Y(n.label[1])})` : '' }, gN);
    t.textContent = n.name.toUpperCase();
  }
});
el('path', { d: pathOf(D.country), fill: '#fff' }, svg);
const gC = el('g', {}, svg);
const cellEls = new Map();
D.cells.forEach((c) => {
  const p = el('path', { d: pathOf(c), class: 'cell', 'data-id': c.id }, gC);
  cellEls.set(c.id, p);
});
const gD = el('g', {}, svg);
const distEls = new Map();
D.districts.forEach((d) => distEls.set(d.name, el('path', { d: pathOf(d), class: 'dist' }, gD)));
el('path', { d: pathOf(D.country), class: 'ctry' }, svg);
const selPath = el('path', { class: 'cellsel', d: '' }, svg);
const gL = el('g', {}, svg);
const kigali = D.districts.filter((d) => d.province === 'Kigali City');
D.districts.forEach((d) => {
  if (d.province === 'Kigali City') return;
  const t = el('text', { x: X(d.label[0]), y: Y(d.label[1]), class: 'lbl', 'text-anchor': 'middle', 'dominant-baseline': 'middle' }, gL);
  t.textContent = d.name;
});
if (kigali.length) {
  const kx = kigali.reduce((s, d) => s + d.label[0], 0) / kigali.length, ky = kigali.reduce((s, d) => s + d.label[1], 0) / kigali.length;
  const t = el('text', { x: X(kx), y: Y(ky), class: 'lbl k', 'text-anchor': 'middle', 'dominant-baseline': 'middle' }, gL);
  t.textContent = 'Kigali';
}

function paint() {
  D.cells.forEach((c) => cellEls.get(c.id).setAttribute('fill', fillFor(c)));
  document.querySelectorAll('.modes button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
  legend();
}

function legend() {
  const L = document.getElementById('legend');
  const sw = (c, t, cls) => `<span><span class="sw ${cls || ''}" style="${c ? 'background:' + c : ''}"></span>${t}</span>`;
  if (mode === 'outlook') {
    L.innerHTML = sw('#8c510a', 'Drier than usual') + sw('#f5f0e6', 'About usual') + sw('#7fcdbb', 'Wetter') +
      sw('#08589e', 'Much wetter') + sw('', 'No useful outlook', 'hatch');
  } else if (mode === 'skill') {
    L.innerHTML = sw('', 'No skill', 'hatch') + sw(SKILL[1], 'Weak ●○○') + sw(SKILL[2], 'Fair ●●○') + sw(SKILL[3], 'Good ●●●');
  } else {
    L.innerHTML = sw(mix(NORMAL_STOPS, 0), NMIN + ' mm') + sw(mix(NORMAL_STOPS, 0.5), Math.round((NMIN + NMAX) / 2) + ' mm') +
      sw(mix(NORMAL_STOPS, 1), NMAX + ' mm') + `<span>Usual Oct–Dec total, ${D.years}</span>`;
  }
}

// ---- panel -------------------------------------------------------------------
const pct = (p) => Math.round(p * 100) + '%';
function dots(n) { return `<span class="dots" aria-label="${n} of 3">${[1, 2, 3].map((i) => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`; }
function tilt(x) {
  if (!x.outlook) return { word: 'No useful outlook here', side: 'none' };
  if (x.pa >= 0.5) return { word: 'Likely wetter than usual', side: 'wet' };
  if (x.pb >= 0.4) return { word: 'Likely drier than usual', side: 'dry' };
  return { word: 'Close to a usual season', side: 'usual' };
}
function chart(monthly) {
  const w = 300, h = 120, bw = w / 12, max = Math.max(...monthly) || 1;
  let s = `<svg viewBox="0 0 ${w} ${h + 30}" width="100%" role="img" aria-label="Usual rainfall by month">`;
  monthly.forEach((v, i) => {
    const bh = Math.max(1, (v / max) * h), x = i * bw + 3, y = h - bh + 14;
    const ond = i >= 9;
    s += `<rect x="${x}" y="${y}" width="${bw - 6}" height="${bh}" rx="3" fill="${ond ? '#e8b84a' : '#d8cbb8'}"><title>${MONTH_NAMES[i]}: ${v} mm</title></rect>`;
    s += `<text x="${x + (bw - 6) / 2}" y="${y - 3}" font-size="9" text-anchor="middle" fill="#6b5a4a">${v}</text>`;
    s += `<text x="${x + (bw - 6) / 2}" y="${h + 27}" font-size="10.5" text-anchor="middle" fill="${ond ? '#8a5a00' : '#9a8b7b'}" font-weight="${ond ? 700 : 400}">${MONTHS[i]}</text>`;
  });
  return s + '</svg>';
}
function body(x, scope) {
  const t = tilt(x);
  let h = `<h2>${t.word}</h2>`;
  if (x.outlook) {
    const dry = t.side === 'dry';
    h += `<div class="big"><b style="color:${dry ? '#8a5a00' : '#1f6f6a'}">${pct(dry ? x.pb : x.pa)}</b><span>chance of ${dry ? 'less' : 'more'} rain than usual in October–December</span></div>`;
    h += `<div class="bar" aria-hidden="true"><span style="flex:${x.pb};background:#d8b365"></span><span style="flex:${x.pn};background:#e8e1d4"></span><span style="flex:${x.pa};background:#5fb3a9"></span></div>`;
    h += `<div class="barlbl"><span>Less ${pct(x.pb)}</span><span>Usual ${pct(x.pn)}</span><span>More ${pct(x.pa)}</span></div>`;
    h += `<div class="row">Expected about <b>${x.pred} mm</b> in Oct–Dec · usual about ${x.normal} mm</div>`;
  } else {
    h += `<p class="muted">Plan for a usual season: about <b>${x.normal} mm</b> of rain in October–December. ${SKILL_LONG[0]}</p>`;
  }
  h += `<div class="row">How far to trust it: <b>${SKILL_WORD[x.dots]}</b>${dots(x.dots)}</div>`;
  if (x.dots) h += `<div class="muted">${SKILL_LONG[x.dots]}</div>`;
  h += `<div class="chart"><h3>Usual rain by month · ${scope} · ${D.years}</h3>${chart(x.monthly)}</div>`;
  return h;
}
function intro() {
  const S = D.skill;
  const withO = D.cells.filter((c) => c.outlook);
  const wet = withO.filter((c) => c.pa >= 0.5).length, dry = withO.filter((c) => c.pb >= 0.4).length;
  const side = wet > dry ? 'wetter' : dry > wet ? 'drier' : null;
  const top = D.districts.filter((d) => d.outlook).sort((a, b) => (side === 'drier' ? b.pb - a.pb : b.pa - a.pa)).slice(0, 3).map((d) => d.name);
  const none = D.districts.filter((d) => !d.outlook).map((d) => d.name).sort();
  const names = (a) => a.length > 1 ? a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1] : a.join('');
  return `<div class="where">Tap anywhere in Rwanda, or pick your district below.</div>
    <h2>${side ? 'Where there is a signal, the season leans ' + side : 'Close to a usual season'}</h2>
    <p class="muted">${S.cells_with_outlook} of ${S.cells} map squares have an outlook${side ? `, and ${side === 'wetter' ? wet : dry} of them lean ${side}. Clearest in ${names(top)}` : ''}.</p>
    ${none.length ? `<p class="muted">No useful outlook for ${none.length} districts, so plan for a usual season there: ${names(none)}.</p>` : ''}
    <p class="muted">Even where there is a signal it is weak. Treat it as a lean, not a promise, and read it alongside Meteo Rwanda.</p>`;
}
function districtAt(lon, lat) { return D.districts.find((d) => inGeom(lon, lat, d)); }
function showCell(c, lon, lat) {
  selCell = c; selDist = null;
  const d = districtAt(lon, lat) || districtAt(c.lon, c.lat);
  selPath.setAttribute('d', pathOf(c));
  distEls.forEach((p) => p.classList.remove('sel'));
  markList(null);
  let h = `<div class="where">${d ? d.name + ' district · ' + (d.province === 'Kigali City' ? 'Kigali City' : d.province + ' Province') : 'Rwanda'} · square ${c.lat.toFixed(2)}°, ${c.lon.toFixed(2)}° (about 28 km across)</div>`;
  h += body(c, 'this square');
  if (d) h += `<p class="muted" style="margin-top:10px">${d.name} district as a whole: ${d.outlook ? pct(d.pa) + ' chance of more rain than usual' : 'no useful outlook'} ${dots(d.dots)} · <a href="#" data-d="${d.name}">show the district</a></p>`;
  document.getElementById('panel').innerHTML = h;
}
function showDistrict(name, scroll) {
  const d = D.districts.find((x) => x.name === name);
  if (!d) return;
  selDist = d; selCell = null;
  selPath.setAttribute('d', '');
  distEls.forEach((p, k) => p.classList.toggle('sel', k === name));
  const p = distEls.get(name); p.parentNode.appendChild(p);
  markList(name);
  let h = `<div class="where">${d.province === 'Kigali City' ? 'Kigali City' : d.province + ' Province'} · whole district (averaged over the squares it covers)</div>`;
  h = h + body(d, d.name).replace('<h2>', `<h2>${d.name}: `);
  document.getElementById('panel').innerHTML = h;
  if (scroll && window.innerWidth <= 760) document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
document.getElementById('panel').addEventListener('click', (e) => {
  const a = e.target.closest('a[data-d]');
  if (a) { e.preventDefault(); showDistrict(a.dataset.d); }
});
svg.addEventListener('click', (e) => {
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
  const lon = loc.x / K + X0, lat = Y0 - loc.y / K;
  if (!inGeom(lon, lat, D.country)) return;
  const c = D.cells.find((c) => Math.abs(lon - c.lon) <= D.grid_deg / 2 && Math.abs(lat - c.lat) <= D.grid_deg / 2);
  if (c) {
    showCell(c, lon, lat);
    if (window.innerWidth <= 760) document.getElementById('panel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
});

// ---- district list -----------------------------------------------------------
function markList(name) { document.querySelectorAll('#dlist button').forEach((b) => b.setAttribute('aria-current', String(b.dataset.d === name))); }
function list(q) {
  const box = document.getElementById('dlist');
  q = (q || '').trim().toLowerCase();
  const rows = D.districts.filter((d) => !q || d.name.toLowerCase().includes(q) || d.province.toLowerCase().includes(q))
    .sort((a, b) => a.name.localeCompare(b.name));
  box.innerHTML = rows.map((d) => `<button type="button" data-d="${d.name}"><span>${d.name}<small>${d.province === 'Kigali City' ? 'Kigali City' : d.province + ' Province'}</small></span>` +
    (d.outlook ? `<span class="v">${pct(d.pa)} ${dots(d.dots)}</span>` : `<span class="v no">no useful outlook</span>`) + '</button>').join('') ||
    '<p class="muted">No district matches.</p>';
  if (selDist) markList(selDist.name);
}
document.getElementById('dlist').addEventListener('click', (e) => { const b = e.target.closest('button[data-d]'); if (b) showDistrict(b.dataset.d, true); });
document.getElementById('search').addEventListener('input', (e) => list(e.target.value));
document.querySelectorAll('.modes button').forEach((b) => b.addEventListener('click', () => { mode = b.dataset.mode; paint(); }));

// ---- text --------------------------------------------------------------------
const S = D.skill;
document.getElementById('title').textContent = `Rwanda rain outlook · October–December ${D.year}`;
document.getElementById('subtitle').textContent = `Chance of more or less rain than usual, area by area. Updated ${D.computed}.`;
document.getElementById('how').innerHTML = `
  <p><b>What it shows.</b> For each area of about 28 km, the chance that October–December rain will be below, near or above what is usual there (the driest, middle and wettest third of ${D.years}).</p>
  <p><b>How it is made.</b> Beelove's seasonal rain model, built on more than 40 years of satellite rainfall records for every area of Rwanda.</p>
  <p><b>How far to trust it.</b> We test the model on every past season it has not seen. In Rwanda the signal is weaker than in Kenya, so we show an outlook only where it has worked before (${S.cells_with_outlook} of ${S.cells} areas). Elsewhere the map is hatched: plan for a usual season. The dots show how far to trust each area.</p>
  <p><b>What it cannot tell you.</b> When the rains start, dry spells within the season, or what your bees will find: flowering follows rain by weeks and depends on what grows near you. Read it alongside Meteo Rwanda's seasonal forecast and what you see in your own area.</p>
  <p>Rainfall records: CHIRPS (Climate Hazards Center, UC Santa Barbara). Boundaries: FAO GAUL districts. Made by Beelove Farm.</p>`;
document.getElementById('foot').textContent = `Beelove Farm · beelovefarm.org/rwanda · updated ${D.computed}`;
document.getElementById('panel').innerHTML = intro();
list('');
paint();

// keep map labels readable at any width: ~8px on a phone, ~11px on a desktop
function sizeLabels() {
  const w = svg.clientWidth || 600;
  const px = Math.max(7.5, Math.min(11, w * 0.017));
  svg.style.setProperty('--lbl', (px * W / w).toFixed(2) + 'px');
}
sizeLabels();
window.addEventListener('resize', sizeLabels);

// let a parent page size the frame to fit
function postHeight() {
  try { parent.postMessage({ type: 'beelove-embed-height', id: 'rwanda-forecast', height: document.documentElement.scrollHeight }, '*'); } catch (e) {}
}
if (window.parent !== window) {
  document.body.classList.add('embedded');
  sizeLabels();
  new ResizeObserver(postHeight).observe(document.body);
  window.addEventListener('load', postHeight);
}
</script>
</body>
</html>
