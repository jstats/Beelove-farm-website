<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Beelove Farm — Field Data Dashboard</title>
<style>
  :root {
    --amber: #f59e0b;
    --amber-dark: #b45309;
    --amber-light: #fef3c7;
    --green: #16a34a;
    --red: #dc2626;
    --ink: #1f2937;
    --muted: #6b7280;
    --bg: #f9fafb;
    --card: #ffffff;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--ink); }

  /* ── Passcode gate ── */
  #gate {
    position: fixed; inset: 0; background: linear-gradient(160deg, #78350f, #b45309);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  #gate .box {
    background: white; border-radius: 16px; padding: 32px; width: 90%; max-width: 360px;
    text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.3);
  }
  #gate h1 { font-size: 1.2rem; margin-bottom: 4px; }
  #gate p { color: var(--muted); font-size: .85rem; margin-bottom: 18px; }
  #gate input {
    width: 100%; padding: 12px; font-size: 1rem; border: 2px solid var(--border);
    border-radius: 10px; text-align: center; letter-spacing: 2px; margin-bottom: 12px;
  }
  #gate input:focus { outline: none; border-color: var(--amber); }
  #gate button {
    width: 100%; padding: 12px; font-size: 1rem; font-weight: 700; color: white;
    background: var(--amber); border: none; border-radius: 10px; cursor: pointer;
  }
  #gate .err { color: var(--red); font-size: .8rem; margin-top: 10px; display: none; }

  /* ── Header ── */
  header {
    background: linear-gradient(135deg, #78350f, #b45309);
    color: white; padding: 18px 20px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  header h1 { font-size: 1.15rem; }
  header .sub { font-size: .78rem; opacity: .85; margin-top: 2px; }
  header .actions { display: flex; gap: 8px; align-items: center; }
  header button {
    background: rgba(255,255,255,.15); color: white; border: 1px solid rgba(255,255,255,.35);
    padding: 8px 14px; border-radius: 8px; font-size: .82rem; cursor: pointer;
  }
  header button:hover { background: rgba(255,255,255,.28); }
  #lastRefresh { font-size: .72rem; opacity: .8; }

  main { max-width: 1200px; margin: 0 auto; padding: 18px 16px 60px; }

  /* ── Status banner ── */
  #status { padding: 10px 14px; border-radius: 10px; font-size: .85rem; margin-bottom: 16px; display: none; }
  #status.loading { display: block; background: var(--amber-light); color: var(--amber-dark); }
  #status.error { display: block; background: #fee2e2; color: var(--red); }

  /* ── Stat cards ── */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .stat .val { font-size: 1.5rem; font-weight: 800; color: var(--amber-dark); }
  .stat .lbl { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }

  /* ── Breakdown bars ── */
  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .panel h3 { font-size: .82rem; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 10px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: .8rem; }
  .bar-row .name { width: 95px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-row .track { flex: 1; background: #f3f4f6; border-radius: 6px; height: 16px; overflow: hidden; }
  .bar-row .fill { height: 100%; background: var(--amber); border-radius: 6px; min-width: 2px; }
  .bar-row .num { width: 28px; text-align: right; color: var(--muted); }

  /* ── Status tabs ── */
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs button {
    padding: 9px 16px; border-radius: 999px; border: 1px solid var(--border);
    background: white; color: var(--ink); font-size: .85rem; font-weight: 600; cursor: pointer;
  }
  .tabs button.active { background: var(--amber); border-color: var(--amber); color: white; }
  .tabs .badge {
    display: inline-block; min-width: 20px; padding: 1px 6px; margin-left: 6px;
    border-radius: 999px; background: var(--red); color: white; font-size: .72rem;
  }
  .tabs button.active .badge { background: rgba(255,255,255,.3); }

  /* ── Geo check + status pills ── */
  .geo-ok { color: var(--green); font-weight: 700; }
  .geo-partial { color: var(--amber-dark); font-weight: 700; }
  .geo-bad { color: var(--red); font-weight: 700; }
  .st-pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .74rem; font-weight: 700; }
  .st-Pending { background: var(--amber-light); color: var(--amber-dark); }
  .st-Verified { background: #dcfce7; color: var(--green); }
  .st-Rejected { background: #fee2e2; color: var(--red); }

  /* ── Review buttons ── */
  .act-btn {
    border: none; border-radius: 8px; padding: 6px 10px; font-size: .76rem;
    font-weight: 700; color: white; cursor: pointer; margin-right: 4px;
  }
  .act-verify { background: var(--green); }
  .act-reject { background: var(--red); }
  td a.tel { color: var(--amber-dark); font-weight: 600; text-decoration: none; }

  /* ── Filters ── */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .filters select, .filters input {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    font-size: .84rem; background: white; color: var(--ink);
  }
  .filters input[type="search"] { flex: 1; min-width: 150px; }

  /* ── Table ── */
  .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; min-width: 900px; }
  th {
    text-align: left; padding: 10px 10px; background: #fffbeb; color: var(--amber-dark);
    border-bottom: 2px solid var(--amber); white-space: nowrap; cursor: pointer; user-select: none;
    position: sticky; top: 0;
  }
  th .arrow { font-size: .7rem; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr.data-row:hover { background: #fffbeb; cursor: pointer; }
  .score-pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-weight: 700; font-size: .78rem; color: white; }
  .empty { text-align: center; color: var(--muted); padding: 30px !important; }

  /* ── Row detail ── */
  tr.detail td { background: #fefce8; padding: 12px 16px; }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px 18px; font-size: .78rem; }
  .detail-grid b { color: var(--amber-dark); }

  footer { text-align: center; font-size: .72rem; color: var(--muted); padding: 20px; }
  @media (max-width: 600px) { header h1 { font-size: 1rem; } }
</style>
</head>
<body>

<!-- ═══════════ PASSCODE GATE ═══════════ -->
<div id="gate">
  <div class="box">
    <div style="font-size:2rem;">🐝</div>
    <h1>Beelove Field Data</h1>
    <p>Enter the team passcode to view the dashboard</p>
    <input type="password" id="passInput" placeholder="Passcode" autocomplete="off"
           onkeydown="if(event.key==='Enter')checkPass()" />
    <button onclick="checkPass()">Unlock</button>
    <div class="err" id="passErr">Wrong passcode — try again.</div>
  </div>
</div>

<header>
  <div>
    <h1>🐝 Beelove Farm — Field Data Dashboard</h1>
    <div class="sub">Live submissions from the field collector</div>
  </div>
  <div class="actions">
    <span id="lastRefresh"></span>
    <button onclick="loadData()">↻ Refresh</button>
  </div>
</header>

<main>
  <div id="status" class="loading">Loading field data…</div>

  <div class="tabs" id="tabBar"></div>

  <div class="stats" id="statCards"></div>
  <div class="panels" id="panels"></div>

  <div class="filters">
    <select id="fArea"><option value="">All areas</option></select>
    <select id="fCollector"><option value="">All collectors</option></select>
    <select id="fVeg"><option value="">All vegetation</option></select>
    <input type="date" id="fFrom" title="From date" />
    <input type="date" id="fTo" title="To date" />
    <input type="search" id="fSearch" placeholder="Search notes, crops, threats…" />
  </div>

  <div class="table-wrap">
    <table id="tbl">
      <thead><tr id="theadRow"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>

<footer>Beelove Farm Intelligence · data updates live from the field collector</footer>

<script>
/* ════════════ CONFIG ════════════ */
var BACKEND_URL = "https://script.google.com/macros/s/AKfycbykLgmLZtybTeAwLbae7ClUzqzwzp92DsFI1Sw5yhWHhqitVB4kZINB-t6ff1rfChTI/exec";
var PASSCODE = "beelove2026";           // ← change the team passcode here
var AUTO_REFRESH_MIN = 5;               // auto-reload data every N minutes

/* ════════════ PASSCODE GATE ════════════ */
function checkPass() {
  var v = document.getElementById("passInput").value.trim();
  if (v === PASSCODE) {
    sessionStorage.setItem("bl_dash_ok", "1");
    document.getElementById("gate").style.display = "none";
    loadData();
  } else {
    document.getElementById("passErr").style.display = "block";
  }
}
if (sessionStorage.getItem("bl_dash_ok") === "1") {
  document.getElementById("gate").style.display = "none";
}

/* ════════════ DATA ════════════ */
var allRecords = [];
var sortKey = "timestamp", sortDir = -1;
var viewStatus = "Verified";   // Verified | Pending | Rejected | All

function statusOf(r) { return r.Status || "Pending"; }

function loadData() {
  var st = document.getElementById("status");
  st.className = "loading"; st.textContent = "Loading field data…";
  fetch(BACKEND_URL)
    .then(function (r) { return r.json(); })
    .then(function (json) {
      if (!json.success) throw new Error(json.error || "Backend returned an error");
      allRecords = json.records || [];
      st.style.display = "none"; st.className = "";
      document.getElementById("lastRefresh").textContent =
        "Updated " + new Date().toLocaleTimeString();
      buildFilterOptions();
      render();
    })
    .catch(function (err) {
      st.className = "error";
      st.textContent = "Could not load data: " + err.message + " — check your connection and press Refresh.";
    });
}
if (sessionStorage.getItem("bl_dash_ok") === "1") loadData();
setInterval(function () {
  if (sessionStorage.getItem("bl_dash_ok") === "1") loadData();
}, AUTO_REFRESH_MIN * 60 * 1000);

/* ════════════ HELPERS ════════════ */
function num(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function recDate(r) {
  var d = r.date || r.timestamp || "";
  var t = new Date(d);
  return isNaN(t) ? null : t;
}
function fmtDate(r) {
  var t = recDate(r);
  return t ? t.toISOString().slice(0, 10) : esc(r.date || "");
}
function scoreColor(s) {
  if (s >= 70) return "#16a34a";
  if (s >= 40) return "#f59e0b";
  return "#dc2626";
}
function count(list, key) {
  var m = {};
  list.forEach(function (r) {
    var v = (r[key] || "").toString().trim() || "—";
    m[v] = (m[v] || 0) + 1;
  });
  return m;
}

/* ════════════ FILTERS ════════════ */
function buildFilterOptions() {
  fillSelect("fArea", count(allRecords, "area"));
  fillSelect("fCollector", count(allRecords, "collector"));
  fillSelect("fVeg", count(allRecords, "vegDensity"));
}
function fillSelect(id, map) {
  var sel = document.getElementById(id);
  var cur = sel.value;
  var first = sel.options[0].outerHTML;
  sel.innerHTML = first + Object.keys(map).sort().map(function (k) {
    return '<option value="' + esc(k) + '">' + esc(k) + " (" + map[k] + ")</option>";
  }).join("");
  sel.value = cur;
}
["fArea", "fCollector", "fVeg", "fFrom", "fTo"].forEach(function (id) {
  document.getElementById(id).addEventListener("change", render);
});
document.getElementById("fSearch").addEventListener("input", render);

function filtered() {
  var a = document.getElementById("fArea").value;
  var c = document.getElementById("fCollector").value;
  var v = document.getElementById("fVeg").value;
  var from = document.getElementById("fFrom").value;
  var to = document.getElementById("fTo").value;
  var q = document.getElementById("fSearch").value.toLowerCase();
  return allRecords.filter(function (r) {
    if (viewStatus !== "All" && statusOf(r) !== viewStatus) return false;
    if (a && String(r.area || "").trim() !== a) return false;
    if (c && String(r.collector || "").trim() !== c) return false;
    if (v && String(r.vegDensity || "").trim() !== v) return false;
    var t = recDate(r);
    if (from && (!t || t < new Date(from))) return false;
    if (to && (!t || t > new Date(to + "T23:59:59"))) return false;
    if (q) {
      var hay = [r.notes, r.crops, r.threats, r.otherFlora, r.area, r.county,
                 r.subCounty, r.collector, r.landUse].join(" ").toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
}

/* ════════════ RENDER ════════════ */
function cols() {
  var c = [
    ["date", "Date"], ["collector", "Collector"], ["phone", "Phone"], ["area", "Area"],
    ["gps", "GPS"], ["GeoCheck", "GPS ✓"], ["vegDensity", "Vegetation"],
    ["hivesTotal", "Hives"], ["hivesColonized", "Colonized"],
    ["score", "Score"], ["Status", "Status"]
  ];
  if (viewStatus === "Pending") c.push(["_actions", "Review"]);
  return c;
}

function render() {
  var list = filtered();
  renderTabs();
  renderStats(list);
  renderPanels(list);
  renderTable(list);
}

function renderTabs() {
  var counts = { Verified: 0, Pending: 0, Rejected: 0, All: allRecords.length };
  allRecords.forEach(function (r) { counts[statusOf(r)] = (counts[statusOf(r)] || 0) + 1; });
  var tabs = [["Verified", "✅ Verified"], ["Pending", "🕐 Pending review"], ["Rejected", "🚫 Rejected"], ["All", "All"]];
  document.getElementById("tabBar").innerHTML = tabs.map(function (t) {
    var badge = t[0] === "Pending" && counts.Pending ? '<span class="badge">' + counts.Pending + "</span>" : "";
    return '<button class="' + (viewStatus === t[0] ? "active" : "") + '" onclick="setView(\'' + t[0] + '\')">' +
      t[1] + " (" + (counts[t[0]] || 0) + ")" + badge + "</button>";
  }).join("");
}

function setView(v) { viewStatus = v; render(); }

/* ════════════ VERIFY / REJECT ════════════ */
function getAdminCreds() {
  var code = sessionStorage.getItem("bl_admin_code");
  if (!code) {
    code = prompt("Admin code (ask Beelove Farm):");
    if (!code) return null;
    sessionStorage.setItem("bl_admin_code", code);
  }
  var name = sessionStorage.getItem("bl_admin_name");
  if (!name) {
    name = prompt("Your name (recorded as verifier):") || "";
    sessionStorage.setItem("bl_admin_name", name);
  }
  return { code: code, name: name };
}

function reviewRecord(id, newStatus) {
  var creds = getAdminCreds();
  if (!creds) return;
  var notes = newStatus === "Rejected" ? (prompt("Reason for rejecting (optional):") || "") : "";
  var st = document.getElementById("status");
  st.className = "loading"; st.style.display = "block";
  st.textContent = (newStatus === "Verified" ? "Verifying…" : "Rejecting…");
  fetch(BACKEND_URL, {
    method: "POST",
    body: JSON.stringify({ action: "verify", adminCode: creds.code, id: id, status: newStatus, verifiedBy: creds.name, notes: notes })
  })
    .then(function (r) { return r.json(); })
    .then(function (json) {
      if (!json.success) {
        if (/admin code/i.test(json.error || "")) sessionStorage.removeItem("bl_admin_code");
        throw new Error(json.error || "Update failed");
      }
      loadData();
    })
    .catch(function (err) {
      st.className = "error";
      st.textContent = "Could not update: " + err.message;
    });
}

function renderStats(list) {
  var hives = 0, colonized = 0, scoreSum = 0, scoreN = 0, last = null;
  var areas = {}, collectors = {};
  list.forEach(function (r) {
    hives += num(r.hivesTotal);
    colonized += num(r.hivesColonized);
    var s = num(r.score);
    if (s > 0) { scoreSum += s; scoreN++; }
    if (r.area) areas[String(r.area).trim()] = 1;
    if (r.collector) collectors[String(r.collector).trim()] = 1;
    var t = recDate(r);
    if (t && (!last || t > last)) last = t;
  });
  var cards = [
    [list.length, "Field stops"],
    [Object.keys(areas).length, "Areas"],
    [Object.keys(collectors).length, "Collectors"],
    [hives, "Hives seen"],
    [hives ? Math.round(colonized / hives * 100) + "%" : "—", "Colonization"],
    [scoreN ? Math.round(scoreSum / scoreN) : "—", "Avg forage score"],
    [last ? last.toISOString().slice(0, 10) : "—", "Latest visit"]
  ];
  document.getElementById("statCards").innerHTML = cards.map(function (c) {
    return '<div class="stat"><div class="val">' + c[0] + '</div><div class="lbl">' + c[1] + "</div></div>";
  }).join("");
}

function renderPanels(list) {
  var html = "";
  html += barPanel("Vegetation density", count(list, "vegDensity"));
  html += barPanel("Stops by area", count(list, "area"));
  // score distribution
  var bands = { "70–100 (good)": 0, "40–69 (fair)": 0, "1–39 (poor)": 0, "No score": 0 };
  list.forEach(function (r) {
    var s = num(r.score);
    if (s >= 70) bands["70–100 (good)"]++;
    else if (s >= 40) bands["40–69 (fair)"]++;
    else if (s >= 1) bands["1–39 (poor)"]++;
    else bands["No score"]++;
  });
  html += barPanel("Forage score distribution", bands, true);
  document.getElementById("panels").innerHTML = html;
}

function barPanel(title, map, keepOrder) {
  var keys = Object.keys(map);
  if (!keepOrder) keys.sort(function (a, b) { return map[b] - map[a]; });
  keys = keys.slice(0, 8);
  var max = Math.max.apply(null, keys.map(function (k) { return map[k]; }).concat([1]));
  var rows = keys.map(function (k) {
    var w = Math.round(map[k] / max * 100);
    return '<div class="bar-row"><span class="name" title="' + esc(k) + '">' + esc(k) +
      '</span><div class="track"><div class="fill" style="width:' + w + '%"></div></div>' +
      '<span class="num">' + map[k] + "</span></div>";
  }).join("");
  return '<div class="panel"><h3>' + esc(title) + "</h3>" + (rows || '<div style="color:var(--muted);font-size:.8rem;">No data yet</div>') + "</div>";
}

function geoClass(v) {
  if (v === "OK") return "geo-ok";
  if (v === "PARTIAL") return "geo-partial";
  if (v === "MISMATCH") return "geo-bad";
  return "";
}

function renderTable(list) {
  var COLS = cols();
  // header
  document.getElementById("theadRow").innerHTML = COLS.map(function (c) {
    if (c[0] === "_actions") return "<th>" + c[1] + "</th>";
    var arrow = sortKey === c[0] ? (sortDir === 1 ? " ▲" : " ▼") : "";
    return '<th onclick="setSort(\'' + c[0] + '\')">' + c[1] + '<span class="arrow">' + arrow + "</span></th>";
  }).join("");

  var sorted = list.slice().sort(function (a, b) {
    var x = a[sortKey], y = b[sortKey];
    var nx = parseFloat(x), ny = parseFloat(y);
    if (!isNaN(nx) && !isNaN(ny)) return (nx - ny) * sortDir;
    return String(x || "").localeCompare(String(y || "")) * sortDir;
  });

  if (!sorted.length) {
    var msg = viewStatus === "Pending" ? "Nothing waiting for review. 🎉" :
              viewStatus === "Verified" ? "No verified stops yet — check the Pending review tab. 🕐" :
              "No field stops match — clear the filters or collect some data! 🐝";
    document.getElementById("tbody").innerHTML =
      '<tr><td class="empty" colspan="' + COLS.length + '">' + msg + "</td></tr>";
    return;
  }

  document.getElementById("tbody").innerHTML = sorted.map(function (r, i) {
    var s = num(r.score);
    var cells = COLS.map(function (c) {
      if (c[0] === "score")
        return '<td><span class="score-pill" style="background:' + scoreColor(s) + '">' + (s || "—") + "</span></td>";
      if (c[0] === "date") return "<td>" + fmtDate(r) + "</td>";
      if (c[0] === "phone") {
        var p = String(r.phone || "").trim();
        return p ? '<td><a class="tel" href="tel:' + esc(p) + '" onclick="event.stopPropagation()">📞 ' + esc(p) + "</a></td>" : "<td>—</td>";
      }
      if (c[0] === "GeoCheck") {
        var g = String(r.GeoCheck || "—");
        return '<td class="' + geoClass(g) + '" title="' + esc(r.GeoDetail || "") + '">' +
          (g === "OK" ? "✔ OK" : g === "PARTIAL" ? "◐ Partial" : g === "MISMATCH" ? "✖ Mismatch" : esc(g)) + "</td>";
      }
      if (c[0] === "Status") {
        var stv = statusOf(r);
        return '<td><span class="st-pill st-' + stv + '">' + stv + "</span></td>";
      }
      if (c[0] === "_actions") {
        return '<td onclick="event.stopPropagation()">' +
          '<button class="act-btn act-verify" onclick="reviewRecord(\'' + esc(String(r.id)) + '\',\'Verified\')">✓ Verify</button>' +
          '<button class="act-btn act-reject" onclick="reviewRecord(\'' + esc(String(r.id)) + '\',\'Rejected\')">✗ Reject</button></td>';
      }
      var v = String(r[c[0]] == null ? "" : r[c[0]]);
      if (v.length > 40) v = v.slice(0, 40) + "…";
      return "<td>" + esc(v) + "</td>";
    }).join("");
    return '<tr class="data-row" onclick="toggleDetail(' + i + ')">' + cells + "</tr>" +
      '<tr class="detail" id="det' + i + '" style="display:none;"><td colspan="' + COLS.length + '">' +
      detailGrid(r) + "</td></tr>";
  }).join("");

  window._sorted = sorted;
}

function detailGrid(r) {
  var skip = { lat: 1, lng: 1, score: 1 };
  var parts = [];
  Object.keys(r).forEach(function (k) {
    if (skip[k]) return;
    var v = r[k];
    if (v === "" || v == null) return;
    parts.push("<div><b>" + esc(k) + ":</b> " + esc(v) + "</div>");
  });
  return '<div class="detail-grid">' + parts.join("") + "</div>";
}

function toggleDetail(i) {
  var el = document.getElementById("det" + i);
  el.style.display = el.style.display === "none" ? "table-row" : "none";
}

function setSort(k) {
  if (sortKey === k) sortDir = -sortDir;
  else { sortKey = k; sortDir = 1; }
  render();
}
</script>
</body>
</html>
